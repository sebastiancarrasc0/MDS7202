table: silver.order_items
purpose: Registrar detalle de artículos y cobros por orden.
grain: Una fila por order_id y order_item_id.
primary_key: [order_id, order_item_id]
owner: Operaciones
lineage: [bronze.order_items]
classification: interno
required_columns: [order_id, order_item_id, price, freight_value]
column_types:
    order_id: string
    order_item_id: integer
    price: float
    freight_value: float
allow_empty: false
constraints:
    price:
        nullable: false
        minimum: 0.0
        finite: true
    freight_value:
        nullable: false
        minimum: 0.0
        finite: true
